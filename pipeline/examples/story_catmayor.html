<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import { THREE, setup, mat, box, walk, idle, armsUp, hero as mkHero, crowdPerson, person, buildTown, buildRoom, textCanvas, textTex, plane, ease, lerp, rnd, FONT, setFace } from '/lib.js';
const E = setup(), { scene, camera } = E;
const town = buildTown(scene);
const cut = (u, d=1.4) => Math.floor(u / d);
// ---------- the cat mayor ----------
function catFace(kind){ const {g, t} = textCanvas(128, 128); g.fillStyle = '#f0a040'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#fff4e0'; g.fillRect(34, 70, 60, 40); const K = '#1b1b1b'; g.strokeStyle = K; g.fillStyle = K; g.lineCap = 'round';
  if (kind === 'sleep'){ g.lineWidth = 6; g.beginPath(); g.moveTo(26, 52); g.lineTo(52, 52); g.moveTo(76, 52); g.lineTo(102, 52); g.stroke(); }
  else if (kind === 'happy'){ g.lineWidth = 6; for (const x of [39, 89]){ g.beginPath(); g.arc(x, 58, 12, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); } }
  else if (kind === 'wink'){ g.fillStyle = '#7ad04a'; g.fillRect(28, 40, 22, 22); g.fillStyle = K; g.fillRect(36, 42, 6, 18); g.lineWidth = 6; g.beginPath(); g.arc(89, 58, 12, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  else { g.fillStyle = '#7ad04a'; g.fillRect(28, 40, 22, 22); g.fillRect(78, 40, 22, 22); g.fillStyle = K; g.fillRect(36, 42, 6, 18); g.fillRect(86, 42, 6, 18); }
  g.fillStyle = '#e86a8a'; g.fillRect(58, 72, 12, 8); g.lineWidth = 4; g.strokeStyle = K; g.beginPath(); g.moveTo(52, 86); g.quadraticCurveTo(58, 94, 64, 86); g.quadraticCurveTo(70, 94, 76, 86); g.stroke();
  g.lineWidth = 2; for (const s of [-1, 1]) for (const dy of [0, 8]){ g.beginPath(); g.moveTo(64 + s * 24, 80 + dy); g.lineTo(64 + s * 60, 76 + dy * 1.5); g.stroke(); } t.needsUpdate = true; return t; }
const CF = {open: catFace('open'), sleep: catFace('sleep'), happy: catFace('happy'), wink: catFace('wink')};
function makeCat(){ const g = new THREE.Group(); const O = 0xf0a040;
  const body = box(1.0, 0.9, 1.7, O); body.position.y = 0.75; const head = new THREE.Group(); head.position.set(0, 1.45, 0.85);
  const hb = box(1.1, 0.95, 0.9, O); const fp = new THREE.Mesh(new THREE.PlaneGeometry(1.08, 0.93), new THREE.MeshLambertMaterial({map:CF.open})); fp.position.z = 0.46; head.add(hb, fp);
  for (const x of [-0.32, 0.32]){ const e = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 4), mat(O)); e.position.set(x, 0.62, 0); e.rotation.y = Math.PI / 4; head.add(e); }
  const tail = box(0.22, 0.22, 1.3, O); tail.position.set(0, 1.1, -1.2); tail.rotation.x = -0.7;
  for (const [x, z] of [[-0.3, 0.6], [0.3, 0.6], [-0.3, -0.6], [0.3, -0.6]]){ const l = box(0.26, 0.4, 0.26, 0xfff4e0); l.position.set(x, 0.2, z); g.add(l); }
  const sash = box(1.04, 0.22, 0.4, 0xd03030); sash.position.set(0, 0.95, 0.3); sash.rotation.z = 0.5;
  const hat = new THREE.Group(); const hb2 = box(0.8, 0.06, 0.8, 0x1a1a1a), ht = box(0.5, 0.55, 0.5, 0x1a1a1a); ht.position.y = 0.3; hat.add(hb2, ht); hat.position.set(0, 0.5, 0); head.add(hat);
  g.add(body, head, tail, sash); g.userData = {head, fp, tail}; scene.add(g); return g; }
const cat = makeCat();
const catFaceSet = k => { cat.userData.fp.material.map = CF[k]; cat.userData.fp.material.needsUpdate = true; };
const zzz = plane(1.2, 0.7, textTex(['Z z z'], {w:256, h:128, bg:'rgba(0,0,0,0)', fg:'#ffffff', size:80})); zzz.material.transparent = true; scene.add(zzz);
// ---------- street posters ----------
function posterTex(lines, bg){ return textTex(lines, {w:256, h:340, bg, fg:'#fff', size:52}); }
const poster = plane(3, 4, posterTex(['기호 1번', '고양이', '30년 연속', '당선!'], '#d84a4a')); poster.position.set(-2, 3, -5.9); scene.add(poster);
const confetti = []; for (let i=0;i<50;i++){ const c = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.1), new THREE.MeshBasicMaterial({color:[0xff5a5a, 0xffd23a, 0x5ac8ff][i % 3], side:THREE.DoubleSide})); scene.add(c); confetti.push([c, rnd() * 10 - 5, rnd() * 4 - 2, rnd() * 8, rnd() * 6]); }
const podium = box(1.6, 1.4, 1.2, 0x8a5a3a); podium.position.set(0, 0.7, -2); scene.add(podium);
// ---------- office ----------
const office = buildRoom(scene, 300);
const desk = box(4, 0.2, 2, 0x7a5232); desk.position.set(300, 2.0, -3); scene.add(desk); const dl = box(3.6, 1.9, 1.8, 0x6a4228); dl.position.set(300, 0.95, -3); scene.add(dl);
const papers = []; for (let i=0;i<6;i++){ const p = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.0), new THREE.MeshBasicMaterial({color:0xf8f8f0})); p.rotation.set(-Math.PI / 2, 0, (rnd() - .5) * 0.6); p.position.set(299 + i * 0.4, 2.11 + i * 0.004, -2.8); scene.add(p); papers.push(p); }
const stamp = plane(0.5, 0.3, textTex(['중요'], {w:128, h:72, bg:'#ffffff', fg:'#d02020', size:48})); stamp.rotation.x = -Math.PI / 2; stamp.position.set(300.3, 2.13, -2.4); scene.add(stamp);
const mtable = box(6, 0.2, 2.4, 0x5a3a24); mtable.position.set(600, 1.6, 0); scene.add(mtable); const mtl = box(5.6, 1.5, 2, 0x4a2a18); mtl.position.set(600, 0.75, 0); scene.add(mtl);
const meet = buildRoom(scene, 600);
const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.35, 10), mat(0xffffff)); scene.add(cup);
// ---------- counting room ----------
const countR = buildRoom(scene, 900);
const ballots = []; for (let i=0;i<30;i++){ const b = new THREE.Group(); const bb = box(1.2, 1, 1, 0x3a5ab0); bb.position.y = 0.5; const slot = box(0.6, 0.04, 0.12, 0x111111); slot.position.y = 1.01; b.add(bb, slot);
  const lab = plane(0.9, 0.35, textTex([`${1996 + i}`], {w:160, h:64, bg:'#fff', fg:'#223', size:44})); lab.position.set(0, 0.55, 0.51); b.add(lab); scene.add(b); ballots.push(b); }
const flash = new THREE.SpotLight(0xffffe0, 0, 18, 0.35, 0.5, 1.2); scene.add(flash); scene.add(flash.target);
// ---------- people ----------
const hero = mkHero(); const cap = box(1.1, 0.3, 1.2, 0x4a4a52); cap.position.set(0, 3.05, 0.1); hero.add(cap); scene.add(hero);
const pad = plane(0.6, 0.8, textTex(['취재 노트', '', '30년 연속?', '이상함…'], {w:200, h:260, bg:'#fffbe8', fg:'#223', size:30})); scene.add(pad);
const padE = plane(0.6, 0.8, textTex(['취재 노트', '', '', ''], {w:200, h:260, bg:'#fffbe8', fg:'#223', size:30})); scene.add(padE);
const crowd = []; for (let i=0;i<8;i++){ const p = crowdPerson(i, 0.85); scene.add(p); crowd.push(p); }
const all = [hero, ...crowd];

window.renderAt = (t) => {
  const {name, u, len} = E.shot(t); const c = cut(u);
  E.sky(1); E.placeSun(1.1); town.setNight(0); E.hemi.intensity = 1.0; scene.fog.far = 160; flash.intensity = 0;
  [office, meet, countR].forEach(r => r.light.intensity = 0);
  all.forEach(p => { p.visible = false; idle(p); p.rotation.set(0, 0, 0); p.position.y = 0; setFace(p, 'neutral'); });
  [zzz, cup, pad, padE, podium].forEach(o => o.visible = false); confetti.forEach(c => c[0].visible = false); ballots.forEach(b => b.visible = false);
  cat.visible = true; cat.rotation.set(0, 0, 0); cat.userData.head.rotation.set(0, 0, 0); cat.userData.tail.rotation.x = -0.7 + Math.sin(t * 3) * 0.2; catFaceSet('open');
  const sleepZ = (x, y, z) => { zzz.visible = true; zzz.position.set(x, y + Math.sin(t * 2) * 0.15, z); zzz.lookAt(camera.position); catFaceSet('sleep'); };
  if (name === 'A'){
    const x = lerp(-6, 2, ease(u / len)); cat.position.set(x, 0, 0); cat.rotation.y = Math.PI / 2; catFaceSet('happy');
    crowd.forEach((p, i) => { p.visible = true; p.position.set(-6 + (i % 4) * 3, 0, i < 4 ? -2.2 : 2.2); p.rotation.y = i < 4 ? 0 : Math.PI; setFace(p, 'happy'); p.userData.arms[1].rotation.x = -2.6 + Math.sin(t * 8 + i) * 0.3; });
    camera.position.set(x + 5, 1.6, 0.6); camera.lookAt(x, 1.2, 0);
  } else if (name === 'A2'){
    podium.visible = true; cat.position.set(0, 1.4, -2); sleepZ(0.6, 3.3, -1.4);
    confetti.forEach(([m, x, z, y0, ph]) => { m.visible = true; m.position.set(x, 7 - ((t * 2 + y0) % 7), z); m.rotation.set(t * 3 + ph, t * 2, 0); });
    crowd.forEach((p, i) => { p.visible = true; p.position.set(-4 + (i % 4) * 2.6, 0, 1 + Math.floor(i / 4) * 1.8); p.rotation.y = Math.PI; setFace(p, 'happy'); armsUp(p, 2.4 + Math.sin(t * 7 + i) * 0.3); });
    camera.position.set(0.5, 5.2, 4.6); camera.lookAt(0, 2.2, -2);
  } else if (name === 'B' || name === 'B2'){
    office.light.intensity = 5; E.sky(1); cat.position.set(300, 2.1, -3); cat.rotation.y = 0.6; cat.scale.setScalar(1);
    if (name === 'B'){ cat.rotation.set(0, 0.6, 0); sleepZ(300.8, 4, -2.5); const k = ease(u / len); camera.position.set(lerp(303.5, 302, k), 3.6, lerp(1.5, 0, k)); camera.lookAt(300, 2.6, -3); }
    else { cat.position.set(300.2, 2.15, -2.7); cat.rotation.set(0, 1.4, Math.PI / 2 * 0.9); sleepZ(301, 3.6, -2.4);
      const s = crowd[0]; s.visible = true; s.position.set(302.6, 0, -1.4); s.rotation.y = -1.6; setFace(s, 'sad'); s.userData.arms.forEach(a => a.rotation.x = -1.3 - Math.abs(Math.sin(t * 6)) * 0.2);
      camera.position.set(301.8, 3.8, 1.4); camera.lookAt(300.5, 2.2, -2.8); }
  } else if (name === 'B3'){
    meet.light.intensity = 5; cat.position.set(601.8, 1.7, 0); cat.rotation.y = Math.PI / 2; cup.visible = true;
    const q = Math.max(0, u - 0.5); cup.position.set(602.6 + q * 1.2, q < 0.05 ? 1.88 : Math.max(0.18, 1.88 - q * q * 9), 0.2); cup.rotation.z = -q * 8;
    cat.userData.head.rotation.y = 0.4;
    crowd.forEach((p, i) => { if (i > 3) return; p.visible = true; p.position.set(597.5 + i * 1.6, 0, i % 2 ? 1.8 : -1.8); p.rotation.y = i % 2 ? Math.PI : 0; setFace(p, u > 0.8 ? 'shock' : 'neutral'); p.userData.head.rotation.y = u > 0.8 ? 0.9 : 0; });
    camera.position.set(605.5, 2.6, 2.2); camera.lookAt(602, 1.5, 0);
  } else if (name === 'C'){
    cat.position.set(0, 0, 0); cat.rotation.y = 0; catFaceSet('happy');
    crowd.forEach((p, i) => { if (i > 4) return; p.visible = true; const a = i / 5 * Math.PI * 2; p.position.set(Math.cos(a) * 2.6, 0, Math.sin(a) * 2.6); p.lookAt(0, 0, 0); setFace(p, 'happy'); p.userData.arms[1].rotation.x = -1.0; p.rotation.x = 0.2; });
    camera.position.set(0.5, 3.4, 5); camera.lookAt(0, 1, 0);
  } else if (name === 'D' || name === 'E'){
    cat.visible = false; hero.visible = true; hero.position.set(0, 0, 0); hero.rotation.y = -0.4; setFace(hero, name === 'D' ? 'smirk' : 'determined');
    pad.visible = true; hero.updateMatrixWorld(true); pad.position.copy(new THREE.Vector3(0.55, 1.9, 0.75).applyMatrix4(hero.matrixWorld)); pad.rotation.set(-0.4, -0.4, 0); hero.userData.arms[1].rotation.x = -1.2;
    if (name === 'D'){ camera.position.set(-1.6, 2.8, 2.6); camera.lookAt(0, 2.5, 0); }
    else if (c === 0){ camera.position.set(0.0, 2.6, 1.7); camera.lookAt(pad.position); } else { hero.userData.head.rotation.z = 0.25; camera.position.set(-1.2, 2.8, 2.2); camera.lookAt(0, 2.6, 0); }
  } else if (['F', 'G', 'G2', 'H', 'I'].includes(name)){
    E.sky(0); E.placeSun(-1); countR.light.intensity = name === 'F' || name === 'G' ? 0.4 : 2.5; E.hemi.intensity = 0.5;
    ballots.forEach((b, i) => { b.visible = i === 29 || name === 'I'; if (i === 29) b.position.set(900, 0, -2.5); else b.position.set(896 + (i % 8) * 1.3, Math.floor(i / 8) * 1.02, -5.2 + (i % 2) * 0.1); });
    cat.position.set(900, 1.02, -2.5); cat.rotation.y = 0.5; cat.scale.setScalar(1);
    hero.visible = name !== 'I'; hero.position.set(lerp(905, 902.8, name === 'F' ? ease(u / len) : 1), 0, name === 'F' ? 1.2 : 0.6); hero.rotation.y = -2.2; setFace(hero, name === 'G2' || name === 'H' ? 'shock' : 'determined');
    if (name === 'F'){ walk(hero, u * 0.6, 0.6, 0.3); hero.rotation.x = 0.25; }
    flash.intensity = 40; hero.updateMatrixWorld(true); flash.position.copy(new THREE.Vector3(0, 2, 0.6).applyMatrix4(hero.matrixWorld)); flash.target.position.set(900, name === 'F' ? 0 : 1.2, -2.5);
    if (name === 'F'){ camera.position.set(906, 3, 4); camera.lookAt(902.5, 1.8, 0); }
    else if (name === 'G'){ cat.visible = false; const k = ease(u / len); camera.position.set(lerp(901.8, 901.4, k), 2.7, lerp(2.4, 1.6, k)); camera.lookAt(900, 1.1, -2.5); }
    else if (name === 'G2'){ sleepZ(900.6, 2.9, -2.1); const k = ease(u / 1.2); camera.position.set(lerp(901.4, 900.6, k), lerp(2.7, 2.2, k), lerp(1.6, -0.2, k)); camera.lookAt(900, 1.6, -2.5); }
    else if (name === 'H'){ sleepZ(900.6, 2.9, -2.1); crowd.forEach((p, i) => { if (i > 2) return; p.visible = true; p.position.set(898.4 + i * 1.6, 0, -0.8); p.rotation.y = Math.PI; setFace(p, ['shock', 'sad', 'determined'][i]); p.userData.arms[1].rotation.x = -1.6 - Math.abs(Math.sin(t * 7 + i)) * 0.3; });
      camera.position.set(903, 3.2, 3); camera.lookAt(900, 1.6, -1.6); }
    else { sleepZ(900.6, 2.9, -2.1); const k = ease(u / len); camera.position.set(lerp(901, 904, k), lerp(2.4, 4.2, k), lerp(0.5, 4.5, k)); camera.lookAt(899, 1.8, -3.5); }
  } else {
    E.sky(0); E.placeSun(-1); countR.light.intensity = 3; E.hemi.intensity = 0.7; ballots[29].visible = true; ballots[29].position.set(900, 0, -2.5);
    cat.position.set(900, 1.02, -2.5); cat.rotation.y = 0.5; hero.visible = true; hero.position.set(899.0, 0, -1.3); hero.rotation.y = 2.5; setFace(hero, 'happy');
    if (name === 'J'){ if (c === 0){ padE.visible = true; hero.updateMatrixWorld(true); padE.position.copy(new THREE.Vector3(0.55, 1.9, 0.75).applyMatrix4(hero.matrixWorld)); padE.rotation.set(-0.4, hero.rotation.y, 0); camera.position.set(900.2, 2.7, 0.4); camera.lookAt(padE.position); setFace(hero, 'neutral'); }
      else { catFaceSet('happy'); hero.userData.arms[1].rotation.x = -1.4 + Math.sin(t * 4) * 0.15; cat.userData.head.rotation.z = Math.sin(t * 4) * 0.1; camera.position.set(902.6, 2.5, -0.6); camera.lookAt(899.8, 1.8, -2.2); } }
    else { catFaceSet('wink'); camera.position.set(lerp(901.2, 900.9, ease(u / len)), 1.9, -0.6); camera.lookAt(900.3, 1.55, -2.0); }
  }
  return E.snap({});
};
window.ready = true;
</script></body></html>
