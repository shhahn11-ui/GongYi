<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>

<script type="module">
import { THREE, setup, mat, box, walk, idle, armsUp, hero as mkHero, crowdPerson, person, buildTown, textCanvas, textTex, plane, ease, lerp, rnd, FONT, setFace } from '/lib.js';

// ---------- dragon with a drawable face ----------
function dragonFaceTex(kind){ const {g, t} = textCanvas(256, 192); g.fillStyle = '#3f9a52'; g.fillRect(0, 0, 256, 192); const K = '#102010'; g.fillStyle = K; g.strokeStyle = K; g.lineCap = 'round';
  if (kind === 'sleep'){ g.lineWidth = 10; for (const x of [70, 186]){ g.beginPath(); g.moveTo(x - 26, 70); g.lineTo(x + 26, 70); g.stroke(); } }

  g.fillStyle = K; g.fillRect(100, 128, 14, 10); g.fillRect(142, 128, 14, 10);
  g.lineWidth = 8; g.beginPath(); if (kind === 'sad'){ g.arc(128, 186, 30, Math.PI * 1.2, Math.PI * 1.8); } else { g.moveTo(80, 160); g.quadraticCurveTo(128, kind === 'happy' || kind === 'blush' || kind === 'wink' ? 186 : 166, 176, 160); } g.stroke();

const DF = {}; ['normal', 'sleep', 'happy', 'blush', 'wink', 'sad'].forEach(k => DF[k] = dragonFaceTex(k));
function makeDragon(fake){
  const g = new THREE.Group(); const C = fake ? 0x8a6a4a : 0x3f9a52, B = fake ? 0x6a5a4a : 0x9ad08a;

const puffs = []; for (let i=0;i<10;i++){ const p = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), new THREE.MeshLambertMaterial({color:0x5a5a5a, flatShading:true})); scene.add(p); puffs.push([p, rnd() * 6]); }

const harin = person({shirt:0xf08ab0, pants:0x4a3a6a, hair:0x3a2414, scale:0.85}); for (const x of [-0.45, 0.45]){ const br = box(0.22, 0.9, 0.22, 0x3a2414); br.position.set(x, 2.1, -0.2); harin.add(br); } scene.add(harin);
const crowd = []; for (let i=0;i<10;i++){ const p = crowdPerson(i, 0.85); scene.add(p); crowd.push(p); }
const lantern = new THREE.PointLight(0xffc070, 0, 12, 1.4); scene.add(lantern); const lanM = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.3), new THREE.MeshBasicMaterial({color:0xffd890})); scene.add(lanM);

const people = [harin, knight, wizard, ...crowd];
window.renderAt = (t) => {

  people.forEach(p => { p.visible = false; idle(p); p.rotation.set(0, 0, 0); p.position.y = 0; setFace(p, 'neutral'); });

  const crowdAt = (x0, faces, ry=-Math.PI / 2) => crowd.forEach((p, i) => { p.visible = true; p.position.set(x0 + (i % 5) * 1.6, 0, i < 5 ? -1.2 : 1.2); p.rotation.y = ry; setFace(p, faces[i % faces.length]); });

    if (c === 0){ crowdAt(-20, ['happy']); crowd.forEach((p, i) => { p.rotation.y = i % 2 ? 0.5 : -0.5; walk(p, t + i, 0.4, 0.3); }); camera.position.set(10, 4, 0.5); camera.lookAt(-40, 6, 0); }

  } else if (name === 'A2'){
    monsters.forEach(([m, ph], i) => { m.visible = true; const k = Math.min(1, u / 1.6); m.position.set(95 + (i % 5) * 2.2, 0, -6 + Math.floor(i / 5) * 3); m.rotation.y = k < 0.6 ? -Math.PI / 2 : Math.PI / 2; m.position.x += k > 0.6 ? (k - 0.6) * 8 : 0; m.rotation.z = Math.sin(t * 30 + ph) * 0.05; });
    camera.position.set(88, 2.6, 6); camera.lookAt(100, 2.4, -3);
  } else if (name === 'B' || name === 'B2'){

    if (name === 'B'){ dface('normal'); camera.position.set(-27, 5, 2.4); camera.lookAt(-47, 7, 0); }
    else { dface('happy'); hat.visible = true; hat.position.set(-48.0, 10.2, 0); suitcase.visible = true; suitcase.position.set(-46, 2.2, 2.6); camera.position.set(-41, 8, 0.6); camera.lookAt(-47, 8, 0); }
  } else if (name === 'C'){
    crowd.forEach((p, i) => { p.visible = true; const a = t * 2 + i; p.position.set(-6 + (i % 5) * 2.6 + Math.sin(a) * 1.4, Math.abs(Math.sin(t * 10 + i)) * 0.3, (i < 5 ? -1 : 1) * 1.2 + Math.cos(a) * 0.8); p.rotation.y = a * 2; armsUp(p, 2.6); setFace(p, i % 2 ? 'shock' : 'sad'); });
    camera.position.set(-12, 3, 0.4); camera.lookAt(0, 2, 0);
  } else if (name === 'D' || name === 'D2'){
    stage.visible = banner.visible = true; crowdAt(-3.6, ['neutral'], Math.PI); crowd.forEach((p, i) => p.position.set(-4 + (i % 5) * 2, 0, 1.4 + Math.floor(i / 5) * 1.6));
    if (name === 'D'){ knight.visible = wizard.visible = true; knight.position.set(-2.5, 1, -3.6); wizard.position.set(0, 1, -3.6); chicken.visible = true; chicken.position.set(2.5, 1, -3.6);
      camera.position.set(0, 3.5, 2.4 + u * 0.1); camera.lookAt(0, 3, -4); }
    else { const k3 = Math.min(2, Math.floor(u / 1.35)), q = (u % 1.35) / 1.35;
      if (k3 === 0){ knight.visible = true; knight.position.set(0, 1, -3.6); setFace(knight, q > 0.4 ? 'shock' : 'determined'); armsUp(knight, 2.6); sword.visible = true; sword.position.set(0 + q * 2, 4.4 + Math.sin(q * Math.PI) * 2 - q * 2, -3 + q * 3); sword.rotation.z = q * 9; }
      else if (k3 === 1){ wizard.visible = true; wizard.position.set(0, 1, -3.6); setFace(wizard, q > 0.3 ? 'shock' : 'determined'); wizard.userData.arms[1].rotation.x = -1.8; if (q > 0.3){ beard.material.color.setHex(0x2a2a2a); puffs.forEach(([p, ph], i) => { p.visible = true; p.position.set(Math.sin(ph) * 0.5, 2.9 + ((q * 2 + ph) % 1) * 2, -3.0 + Math.cos(ph) * 0.3); }); } else beard.material.color.setHex(0xe8e8e8); }
      else { chicken.visible = true; chicken.position.set(q * 10, 1 + Math.abs(Math.sin(q * 30)) * 0.3, -3.6 + q * 2); chicken.rotation.y = Math.PI / 2; }
      camera.position.set(0, 3.2, 1.5); camera.lookAt(0, 2.6, -3.6); }

    if (name === 'E'){ const x = lerp(-34, -42, ease(u / len)); harin.position.x = x; walk(harin, u, 0.6, 0.4); lantern.position.x = x - 0.5; lanM.position.x = x - 0.6; dface('normal'); camera.position.set(x + 6, 3, 2.5); camera.lookAt(-46, 5, 0); }
    else if (name === 'E2'){ setFace(harin, 'shock'); harin.userData.head.rotation.x = -0.4; camera.position.set(-44.5, 3.4, 1.2); camera.lookAt(-42, 2.9, 0.5); }
    else if (name === 'F'){ dface('blush'); camera.position.set(-40.5, 7.5, 0.5); camera.lookAt(-47, 8, 0); }

      monsters.forEach(([m, ph], i) => { if (i > 4) return; m.visible = true; const q = (u / len); m.position.set(-28 + i * 1.8 - (q > 0.5 ? 0 : 0), 0, -1.5 + (i % 2) * 2.5); m.rotation.y = q < 0.5 ? -Math.PI / 2 : Math.PI / 2; m.position.x += q > 0.5 ? (q - 0.5) * 20 : 0; });
      camera.position.set(-16, 4, 2.2); camera.lookAt(-36, 5, 0); }
  } else if (['G', 'H', 'I', 'I2', 'J'].includes(name)){
    night(); scene.background.setHex(0x1a0a20); dragon.visible = false; fakeD.visible = true; fakeD.position.set(42, 0, 0); fakeD.rotation.y = Math.PI / 2;
